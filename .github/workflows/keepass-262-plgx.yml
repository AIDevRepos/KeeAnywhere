name: KeeAnywhere KeePass 2.62 PLGX

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/keepass-262-plgx.yml"
      - "KeeAnywhere/**"
      - "KeeAnywhere.sln"
      - "NuGet.config"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-plgx:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore KeeAnywhere.sln -NonInteractive

      - name: Provide .NET Framework 4.6.1 reference assemblies for PlgxTool
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net461 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP/net461" -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Reference assembly package restore failed' }
          $source = Join-Path $env:RUNNER_TEMP 'net461/Microsoft.NETFramework.ReferenceAssemblies.net461.1.0.3/build/.NETFramework/v4.6.1'
          $target = Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies/Microsoft/Framework/.NETFramework/v4.6.1'
          if (-not (Test-Path (Join-Path $source 'Facades/System.Threading.Tasks.dll'))) { throw 'Missing net461 facade in package' }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $target -Recurse -Force
          if (-not (Test-Path (Join-Path $target 'Facades/System.Threading.Tasks.dll'))) { throw 'Missing target net461 facade' }

      - name: Build Release PLGX
        run: msbuild KeeAnywhere.sln /p:Configuration=Release /t:Rebuild /m /v:minimal

      - name: Validate and hash PLGX
        shell: pwsh
        run: |
          $file = 'KeeAnywhere/bin/Release/KeeAnywhere.plgx'
          if (-not (Test-Path $file)) { throw "Missing PLGX: $file" }
          $sha256 = (Get-FileHash $file -Algorithm SHA256).Hash
          Write-Host "PLGX SHA-256: $sha256"
          "PLGX SHA-256: \`$sha256\`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload PLGX
        uses: actions/upload-artifact@v4
        with:
          name: KeeAnywhere-master-KeePass-2.62-PLGX
          path: KeeAnywhere/bin/Release/KeeAnywhere.plgx
          if-no-files-found: error
