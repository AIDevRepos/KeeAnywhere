name: KeeAnywhere KeePass 2.62 PLGX

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/keepass-262-plgx.yml"
      - "KeeAnywhere/**"
      - "KeeAnywhere.sln"
      - "NuGet.config"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-plgx:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore KeeAnywhere.sln -NonInteractive

      - name: Build Release PLGX
        run: msbuild KeeAnywhere.sln /p:Configuration=Release /t:Rebuild /m /v:minimal

      - name: Validate and hash PLGX
        shell: pwsh
        run: |
          $file = 'KeeAnywhere/bin/Release/KeeAnywhere.plgx'
          if (-not (Test-Path $file)) { throw "Missing PLGX: $file" }
          $sha256 = (Get-FileHash $file -Algorithm SHA256).Hash
          Write-Host "PLGX SHA-256: $sha256"
          "PLGX SHA-256: \`$sha256\`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload PLGX
        uses: actions/upload-artifact@v4
        with:
          name: KeeAnywhere-master-KeePass-2.62-PLGX
          path: KeeAnywhere/bin/Release/KeeAnywhere.plgx
          if-no-files-found: error
