name: KeeAnywhere Google Drive Only - KeePass 2.62
on:
  push:
    branches: [google-drive-only-2.1.0-keepass-2.62]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore dependencies
        run: nuget restore KeeAnywhere.sln -NonInteractive
      - name: Provide .NET Framework 4.6.1 reference facades for PlgxTool
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net461 -Version 1.0.3 -OutputDirectory "$env:RUNNER_TEMP/net461" -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'Reference package restore failed' }
          $source = Join-Path $env:RUNNER_TEMP 'net461/Microsoft.NETFramework.ReferenceAssemblies.net461.1.0.3/build/.NETFramework/v4.6.1'
          $target = Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies/Microsoft/Framework/.NETFramework/v4.6.1'
          if (-not (Test-Path (Join-Path $source 'Facades/System.Threading.Tasks.dll'))) { throw 'Missing reference facade in package' }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $source '*') $target -Recurse -Force
      - name: Build PLGX
        run: msbuild KeeAnywhere.sln /p:Configuration=Release /t:Rebuild /m /v:minimal
      - name: Verify expected resource manifest
        shell: pwsh
        run: |
          $dll = 'KeeAnywhere/bin/Release/KeeAnywhere.dll'
          if (-not (Test-Path $dll)) { throw 'KeeAnywhere.dll missing' }
          $assembly = [System.Reflection.Assembly]::LoadFrom((Resolve-Path $dll))
          $names = $assembly.GetManifestResourceNames()
          if ($names -notcontains 'KeeAnywhere.PluginResources.resources') { throw "Expected resource missing: KeeAnywhere.PluginResources.resources; found $($names -join ', ')" }
          $resource = $assembly.GetManifestResourceStream('KeeAnywhere.PluginResources.resources')
          if ($null -eq $resource -or $resource.Length -le 0) { throw 'Embedded resource stream missing' }
          $resource.Dispose()

      - name: Check legacy OIDC logging dependencies
        shell: pwsh
        run: |
          $required = @(
            'Microsoft.Extensions.Configuration.dll',
            'Microsoft.Extensions.Configuration.Abstractions.dll',
            'Microsoft.Extensions.Configuration.Binder.dll',
            'Microsoft.Extensions.DependencyInjection.Abstractions.dll',
            'Microsoft.Extensions.Logging.dll',
            'Microsoft.Extensions.Logging.Abstractions.dll',
            'Microsoft.Extensions.Options.dll',
            'Microsoft.Extensions.Primitives.dll'
          )
          foreach ($name in $required) {
            $path = Join-Path 'KeeAnywhere/bin/Release' $name
            if (-not (Test-Path $path)) { throw "Missing OIDC dependency: $name" }
            Write-Host "Dependency OK: $name"
          }

      - name: Smoke test OIDC options in .NET Framework
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = (Resolve-Path 'KeeAnywhere/bin/Release').Path
          $oidc = [System.Reflection.Assembly]::LoadFrom((Join-Path $folder 'IdentityModel.OidcClient.dll'))
          $type = $oidc.GetType('IdentityModel.OidcClient.OidcClientOptions', $true)
          $options = [System.Activator]::CreateInstance($type)
          if ($null -eq $options) { throw 'OIDC options could not be instantiated' }
          Write-Host 'OIDC options constructor passed with bundled dependencies'

      - name: Verify artifact and SHA256
        shell: pwsh
        run: |
          $f = 'KeeAnywhere/bin/Release/KeeAnywhere.plgx'
          if (-not (Test-Path $f)) { throw 'PLGX missing' }
          $hash = (Get-FileHash $f -Algorithm SHA256).Hash
          $size = (Get-Item $f).Length
          Write-Host "PLGX SHA256: $hash"
          Write-Host "PLGX bytes: $size"
          "PLGX SHA256: $hash; bytes: $size" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload PLGX
        uses: actions/upload-artifact@v4
        with:
          name: KeeAnywhere-GDrive-v2.1.0.3-KeePass262
          path: KeeAnywhere/bin/Release/KeeAnywhere.plgx
          if-no-files-found: error
